<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books by {{ author }}</title>
    <link rel="stylesheet" type="text/css" href="../static/style.css">
</head>
<body>

<h1>Books by {{ author }}:</h1>

{% if books %}
<table class="customTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
    </tr>
    </thead>
    <tbody>
    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<h2>No books found for {{ author }}.</h2>
{% endif %}

<a href="/books">Back to all books</a>

</body>
</html>
