version: '3.10'

services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - mynetwork
    ports:
      - "8000:8000"
    depends_on:
      - postgres-db
    environment:
      DATABASE_URL: postgres://simon:simon@postgres-db:5432/skillbox_db

  postgres-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: skillbox_db
      POSTGRES_USER: simon
      POSTGRES_PASSWORD: simon
    networks:
      - mynetwork
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql_logs:/var/log/postgresql # локалка с логами
    command: >
      postgres -c log_destination=stderr
               -c logging_collector=on
               -c log_directory=/var/log/postgresql

networks:
  mynetwork:

volumes:
  postgres_data:
