name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Public-CI-linters/module_30_ci_linters/materials/gitlab-ci/requirements.txt

      - name: Run linters
        run: |
          mypy module_30_ci_linters/homework/app/src/  # Проверка типов
          black --diff --check module_30_ci_linters/homework/app/src/  # Проверка форматирования
          isort --check-only module_30_ci_linters/homework/app/src/  # Проверка порядка импортов
          flake8 module_30_ci_linters/homework/app/src/  # Проверка стиля кода

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Public-CI-linters/module_30_ci_linters/materials/gitlab-ci/requirements.txt

      - name: Run tests
        run: |
          pytest module_30_ci_linters/homework/app/tests/

